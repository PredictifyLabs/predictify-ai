name: Comment When PR Ready for Review

on:
  pull_request:
    types:
      - ready_for_review

jobs:
  send-comment:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Add comment
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            🚀 The pull request is now **Ready for Review**!
            Reviewers have been assigned automatically. 🎯
